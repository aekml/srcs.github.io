<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Directory</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><aside class="sidebar"><div class="logo"><i class="fa-solid fa-address-book"></i><div><strong>UTILITY</strong><span> DIRECTORY</span></div></div><div id="filtersRoot"></div></aside><main class="main"><header class="topbar"><button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle filters"><i class="fa-solid fa-bars"></i></button><div class="search-wrapper"><input id="searchInput" type="search" placeholder="Search PIN, name, email, phone, designation, office"><button id="clearSearchBtn" class="search-clear" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button></div><span id="resultCount" class="result-count">0 results</span><div class="actions"><button id="copyBtn" class="copy-btn"><i class="fa-solid fa-copy"></i> Copy Emails</button><button id="clearBtn" class="clear-btn">Clear</button></div><span id="copiedMsg" class="copied-msg">Copied</span></header><div id="emptyState" class="empty-state" hidden><i class="fa-solid fa-magnifying-glass"></i><p>No results found.</p></div><div id="cardContainer" class="cards"></div></main></div><div id="sidebarBackdrop" class="sidebar-backdrop"></div>
<div id="profileBackdrop" class="profile-backdrop" aria-hidden="true"></div><section id="profileModal" class="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profileTitle" aria-hidden="true"><button id="profileClose" class="profile-close" aria-label="Close service history">&times;</button><header id="profileHeader" class="profile-header"></header><div id="historySummary" class="history-summary"></div><div class="history-content"><p id="historyStatus" class="history-status"></p><div id="desktopTimelineHost" class="desktop-timeline-host"></div><div id="mobileTimelineHost" class="mobile-timeline-host"></div><div id="historyDetail" class="history-detail" hidden></div></div></section>
<script src="config.js"></script><script src="history-timeline.js"></script><script src="app.js"></script></body></html>
