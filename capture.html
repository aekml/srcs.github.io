<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Data Capture R1</title>
    <link rel="stylesheet" href="capture.css">
</head>

<body>
    <main class="wrap">
        <header>
            <h1>Post & Person Data Capture</h1>
            <p>Validated single-record entry for the directory staging dataset.</p>
        </header>
        <div id="loadNotice" class="notice">Loading validation rules and hierarchy…</div>
        <nav><a href="bulk-upload.html">Validate a bulk CSV file →</a></nav>
        <div id="summary" class="error-summary" tabindex="-1"></div>
        <form id="form" class="grid" novalidate>
            <fieldset>
                <legend>Person details</legend>
                <div class="field"><label class="required" for="PersonName">Person name</label><input id="PersonName"
                        name="PersonName" type="text">
                    <div id="err-PersonName" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="FatherOrGuardianName">Father / guardian name</label><input
                        id="FatherOrGuardianName" name="FatherOrGuardianName" type="text">
                    <div id="err-FatherOrGuardianName" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="DateOfBirth">Date of birth</label><input id="DateOfBirth"
                        name="DateOfBirth" type="date">
                    <div id="err-DateOfBirth" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="DateOfJoiningService">Date of joining service</label><input
                        id="DateOfJoiningService" name="DateOfJoiningService" type="date">
                    <div id="err-DateOfJoiningService" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="OfficialPIN">Official PIN</label><input id="OfficialPIN"
                        name="OfficialPIN" type="text">
                    <div id="err-OfficialPIN" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="Email">Personal email</label><input id="Email" name="Email"
                        type="email">
                    <div id="err-Email" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="PersonalMobile">Personal Mobile</label><input
                        id="PersonalMobile" name="PersonalMobile" type="tel">
                    <div id="err-PersonalMobile" class="field-error"></div>
                </div>
                <div class="field" id="group-PersonStatus"><label class="required"
                        for="PersonStatus">PersonStatus</label><select id="PersonStatus" name="PersonStatus">
                        <option value="">(select)</option>
                    </select>
                    <div id="err-PersonStatus" class="field-error"></div>
                </div>
            </fieldset>
            <fieldset>
                <legend>Post / office details</legend>
                <div class="field" id="group-PostTitle"><label class="required" for="PostTitle">PostTitle</label><select
                        id="PostTitle" name="PostTitle">
                        <option value="">(select)</option>
                    </select>
                    <div id="err-PostTitle" class="field-error"></div>
                </div>
                <div class="field" id="group-Level"><label class="required" for="Level">Level</label><select id="Level"
                        name="Level">
                        <option value="">(select)</option>
                    </select>
                    <div id="err-Level" class="field-error"></div>
                </div>
                <div class="field" id="group-Zone"><label class="required" for="Zone">Zone</label><select id="Zone"
                        name="Zone">
                        <option value="">(select)</option>
                    </select>
                    <div id="err-Zone" class="field-error"></div>
                </div>
                <div class="field" id="group-Circle"><label class="required" for="Circle">Circle</label><select
                        id="Circle" name="Circle">
                        <option value="">(select)</option>
                    </select>
                    <div id="err-Circle" class="field-error"></div>
                </div>
                <div class="field" id="group-Division"><label class="required" for="Division">Division</label><select
                        id="Division" name="Division">
                        <option value="">(select)</option>
                    </select>
                    <div id="err-Division" class="field-error"></div>
                </div>
                <div class="field" id="group-Subdivision"><label class="required"
                        for="Subdivision">Subdivision</label><select id="Subdivision" name="Subdivision">
                        <option value="">(select)</option>
                    </select>
                    <div id="err-Subdivision" class="field-error"></div>
                </div>
                <div class="field" id="group-Section"><label class="required" for="Section">Section</label><select
                        id="Section" name="Section">
                        <option value="">(select)</option>
                    </select>
                    <div id="err-Section" class="field-error"></div>
                </div>
                <div class="field" id="group-PostStatus"><label class="required"
                        for="PostStatus">PostStatus</label><select id="PostStatus" name="PostStatus">
                        <option value="">(select)</option>
                    </select>
                    <div id="err-PostStatus" class="field-error"></div>
                </div>
                <div class="field"><label class="required" for="OfficeName">Office name</label><input id="OfficeName"
                        name="OfficeName" type="text">
                    <div id="err-OfficeName" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="OfficialEmail">Official Email</label><input id="OfficialEmail"
                        name="OfficialEmail" type="email">
                    <div id="err-OfficialEmail" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="OfficeMobile">Office Mobile</label><input id="OfficeMobile"
                        name="OfficeMobile" type="tel">
                    <div id="err-OfficeMobile" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="Address">Office Address</label><textarea id="Address"
                        name="Address"></textarea>
                    <div id="err-Address" class="field-error"></div>
                </div>
            </fieldset>
            <fieldset>
                <legend>Assignment details</legend>
                <div class="field"><label class="" for="StartDate">Start date</label><input id="StartDate"
                        name="StartDate" type="date">
                    <div id="err-StartDate" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="EndDate">End date</label><input id="EndDate" name="EndDate"
                        type="date">
                    <div id="err-EndDate" class="field-error"></div>
                </div>
                <div class="field" id="group-AssignmentType"><label class="required"
                        for="AssignmentType">AssignmentType</label><select id="AssignmentType" name="AssignmentType">
                        <option value="">(select)</option>
                    </select>
                    <div id="err-AssignmentType" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="OrderReference">Order reference</label><input
                        id="OrderReference" name="OrderReference" type="text">
                    <div id="err-OrderReference" class="field-error"></div>
                </div>
                <div class="field"><label class="" for="Note">Remarks</label><textarea id="Note" name="Note"></textarea>
                    <div id="err-Note" class="field-error"></div>
                </div>
            </fieldset>
            <div class="actions"><button class="btn secondary" id="reset" type="button">Clear form</button><button
                    class="btn primary" id="validate" type="button" disabled>Validate & Download CSV Row</button></div>
        </form>
        <section id="output" class="output" hidden>
            <h2>Validated row</h2>
            <div id="warnings"></div>
            <div id="preview" class="code"></div>
            <div class="actions"><button id="copy" class="btn secondary" type="button">Copy CSV Row</button><button
                    id="download" class="btn primary" type="button">Download CSV</button></div>
        </section>
    </main>
    <script src="validation-core.js"></script>
    <script>
        let rules, hierarchy; const $ = x => document.getElementById(x), form = $('form'); const val = n => form.elements[n]?.value.trim() || '';
        Promise.all([fetch('validation-rules.json').then(r => r.json()), fetch('hierarchy.csv').then(r => r.text()).then(CaptureCore.parseCsv)]).then(([r, h]) => { rules = r; hierarchy = h; setup(); $('loadNotice').textContent = 'Ready. Values marked * are required.'; $('validate').disabled = false }).catch(() => { $('loadNotice').textContent = 'Configuration could not load. Validation is disabled.'; $('loadNotice').className = 'error-summary show' });
        function options(n, values) { let s = $(n); s.innerHTML = '<option value="">(select)</option>' + values.map(v => `<option>${CaptureCore.esc(v)}</option>`).join('') }
        function unique(values) { return [...new Set(values.filter(Boolean))].sort() }
        function setup() { Object.entries(rules.allowedValues).forEach(([n, v]) => options(n, v)); options('Zone', unique(hierarchy.map(r => r.Zone))); $('Level').addEventListener('change', levelChanged);['Zone', 'Circle', 'Division', 'Subdivision'].forEach(n => $(n).addEventListener('change', cascade)); form.addEventListener('blur', e => { if (e.target.name) paint() }, true); $('validate').onclick = exportRow; $('reset').onclick = () => { if ([...form.elements].some(e => e.value) && confirm('Clear all entered values?')) { form.reset(); levelChanged(); $('output').hidden = true; clearSummary() } }; levelChanged() }
        function levelChanged() { ['Zone', 'Circle', 'Division', 'Subdivision', 'Section'].forEach(n => { $(n).value = ''; $('group-' + n).hidden = true }); let l = val('Level'); (rules.hierarchyLevels[l] || []).forEach(n => $('group-' + n).hidden = false); cascade(); paint() }
        function cascade() { let z = val('Zone'), c = val('Circle'), d = val('Division'), s = val('Subdivision'); options('Circle', unique(hierarchy.filter(r => r.Zone === z).map(r => r.Circle))); options('Division', unique(hierarchy.filter(r => r.Zone === z && r.Circle === c).map(r => r.Division))); options('Subdivision', unique(hierarchy.filter(r => r.Zone === z && r.Circle === c && r.Division === d).map(r => r.Subdivision))); options('Section', unique(hierarchy.filter(r => r.Zone === z && r.Circle === c && r.Division === d && r.Subdivision === s).map(r => r.Section))); let hit = hierarchy.find(r => r.Zone === z && r.Circle === c && r.Division === d && r.Subdivision === s && r.Section === val('Section')); if (hit?.OfficeName && !val('OfficeName')) $('OfficeName').value = hit.OfficeName }
        function record() { return Object.fromEntries(rules.csvHeader.map(n => [n, val(n)])) }
        function clearSummary() { $('summary').className = 'error-summary'; $('summary').innerHTML = '' }
        function paint() { if (!rules) return; let r = CaptureCore.validate(record(), rules, hierarchy); rules.csvHeader.forEach(n => { let el = form.elements[n], box = $('err-' + n), issue = r.errors.find(x => x.field === n); if (!el || !box) return; el.classList.toggle('invalid', !!issue); el.setAttribute('aria-invalid', !!issue); box.textContent = issue?.message || ''; box.classList.toggle('show', !!issue) }) }
        function exportRow() { let r = CaptureCore.validate(record(), rules, hierarchy); paint(); clearSummary(); if (r.errors.length) { $('summary').innerHTML = '<b>Please correct the following:</b><ul>' + r.errors.map(x => `<li><a href="#${x.field}">${x.message}</a></li>`).join('') + '</ul>'; $('summary').className = 'error-summary show'; $('summary').focus(); return } let csv = rules.csvHeader.join(',') + '\n' + rules.csvHeader.map(n => CaptureCore.csvEscape(record()[n])).join(','); $('preview').textContent = csv; $('warnings').innerHTML = r.warnings.length ? '<div class="warn">' + r.warnings.map(w => CaptureCore.esc(w.message)).join('<br>') + '</div>' : '<div class="ok">Record validated with no warnings.</div>'; $('output').hidden = false; $('copy').onclick = () => navigator.clipboard.writeText(rules.csvHeader.map(n => CaptureCore.csvEscape(record()[n])).join(',')); $('download').onclick = () => { let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'validated-record.csv'; a.click(); URL.revokeObjectURL(a.href) } }
    </script>
</body>

</html>
