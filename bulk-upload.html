<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulk CSV Validation</title><link rel="stylesheet" href="capture.css"></head><body><main class="wrap"><header><h1>Bulk CSV Validation</h1><p>Validate staging records before review. No data is uploaded or published.</p></header><p><a href="capture.html">← Single-record capture</a></p><div id="notice" class="notice">Loading validation configuration…</div><button id="template" class="btn secondary" disabled>Download CSV Template</button><div id="drop" class="drop"><b>Drop a CSV file here</b><p>or <label><input id="file" type="file" accept=".csv,text/csv" hidden><u>choose a CSV file</u></label></p><small>Maximum 5 MB and 1,000 data rows.</small></div><section id="report" class="report" hidden><div id="stats" class="stats"></div><div class="actions"><button id="valid" class="btn primary">Download Valid Rows</button><button id="warn" class="btn secondary">Download Warning Rows</button><button id="invalid" class="btn secondary">Download Invalid Rows</button><button id="json" class="btn secondary">Download JSON Report</button></div><div class="tablewrap"><table class="issues"><thead><tr><th>Row</th><th>Status</th><th>Field</th><th>Issue</th><th>Message</th></tr></thead><tbody id="issues"></tbody></table></div></section></main><script src="validation-core.js"></script><script>
let rules,hierarchy,result;const $=x=>document.getElementById(x);Promise.all([fetch('validation-rules.json').then(r=>r.json()),fetch('hierarchy.csv').then(r=>r.text()).then(CaptureCore.parseCsv)]).then(([r,h])=>{rules=r;hierarchy=h;$('notice').textContent='Ready to validate a CSV file.';$('template').disabled=false}).catch(()=>{$('notice').textContent='Unable to load validation configuration.';$('notice').className='error-summary show'});$('template').onclick=()=>download('capture-template.csv',rules.csvHeader.join(',')+'\n');let drop=$('drop');['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>process(e.dataTransfer.files[0]));$('file').onchange=e=>process(e.target.files[0]);function process(f){if(!rules||!f)return;if(f.size>rules.validation.bulkUploadMaximumBytes)return alert('File exceeds 5 MB.');let reader=new FileReader();reader.onload=()=>validate(reader.result,f.name);reader.readAsText(f)}function validate(text,name){let rows=CaptureCore.parseCsv(text), expected=rules.csvHeader.join('|'),got=rows[0]?Object.keys(rows[0]).join('|'):'';if(!rows.length)return alert('No data rows found.');if(got!==expected)return alert('CSV header must match the approved template exactly.');if(rows.length>rules.validation.bulkUploadMaximumRows)return alert(`Maximum ${rules.validation.bulkUploadMaximumRows} data rows allowed.`);result={file:name,timestamp:new Date().toISOString(),valid:[],warnings:[],invalid:[],issues:[]};rows.forEach((r,i)=>{let v=CaptureCore.validate(r,rules,hierarchy),row=i+2;if(v.errors.length)result.invalid.push(r);else if(v.warnings.length)result.warnings.push({...r,ValidationWarnings:v.warnings.map(x=>x.code).join(';')});else result.valid.push(r);[...v.errors.map(x=>({...x,status:'Error'})),...v.warnings.map(x=>({...x,status:'Warning'}))].forEach(x=>result.issues.push({row,...x}))});render(rows.length)}function render(total){$('report').hidden=false;$('stats').innerHTML=[['Total',total],['Valid',result.valid.length],['Warnings',result.warnings.length],['Errors',result.invalid.length]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');$('issues').innerHTML=result.issues.slice(0,100).map(x=>`<tr><td>${x.row}</td><td>${x.status}</td><td>${x.field}</td><td>${x.code}</td><td>${CaptureCore.esc(x.message)}</td></tr>`).join('')||'<tr><td colspan="5">No issues found.</td></tr>';$('valid').onclick=()=>downloadRows('valid-rows.csv',result.valid);$('warn').onclick=()=>downloadRows('rows-with-warnings.csv',result.warnings);$('invalid').onclick=()=>downloadRows('invalid-rows.csv',result.invalid,true);$('json').onclick=()=>download('validation-report.json',JSON.stringify(result,null,2),'application/json')}function downloadRows(name,rows,issues){let h=issues?[...rules.csvHeader,'UploadRow','ValidationErrors','ValidationWarnings']:rows[0]?Object.keys(rows[0]):rules.csvHeader;download(name,[h.join(','),...rows.map((r,i)=>h.map(k=>CaptureCore.csvEscape(r[k]||'')).join(','))].join('\n'))}function download(name,text,type='text/csv'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}</script></body></html>
